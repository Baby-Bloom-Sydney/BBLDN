# CI — BabyBloom London (HANDOFF §9; 05 §9; 06 §3.4; 07 §10.2)
#
# One job per protection-check name. `main` requires all eight (06 §3.4):
#   typecheck · lint · test · build · allowed-imports · banned-literals · types-drift · gitleaks
#   `limiter-call-sites` (ADR-140 (2)) is green from the PR that adds it and joins that list per ADR-109.
#
# Stage → job → what runs (05 §9 numbering):
#   1 lint            → lint            eslint · prettier --check · CLAUDE.md = CODE-CLAUDE.md (local gate, see below)
#   1 lint            → allowed-imports scripts/gen-boundary-rules.ts --check + eslint.boundaries.js (S6 — green;
#                                        joins the required-check list per ADR-109 when this PR merges)
#   1 lint            → limiter-call-sites  scripts/ci/check-limiter-call-sites.mjs — a rate-limit policy declared
#                                        in config/security.ts with no consumer outside config/ fails (ADR-140 (2) /
#                                        ADR-142 (2)); a recorded gap carries its reason in limiter-call-sites.allow.json
#                                        + scripts/ci/check-action-limits.mjs — the inverse (REVIEW-3 R-3 / M-1): a
#                                        server action that reaches no limiter fails; same job, same allow file
#   1 lint            → config-gates    scripts/ci/check-config-literals.mjs (including ADR-172's `safeguarding`
#                                        rule) · env:check (.env.example) · crons:check (vercel.json) ·
#                                        process.env grep outside config. GREEN today — joins the required list
#                                        per ADR-109 once it is green on `main` (L-009 `3e`, Q-4)
#   1 lint            → banned-literals banned-words static pre-check ONLY — red on the legacy parent surfaces
#                                        until F-d, and it is the only step left here for that reason
#   2 typecheck       → typecheck       tsc --noEmit --pretty false
#   3–6 tests         → test            vitest --coverage → diff-cover ≥ 80 % changed lines · contract · integration
#                                        (supabase start) · e2e (next build → playwright)              [red until S2–S5, E1]
#   5 integration     → integration     supabase start + db reset (0000..NN from empty, the whole ordered set) → vitest --project
#                                        integration. The same suites `test` runs, in a job that can block a
#                                        merge (REVIEW-3 M-10 / R-6); same-repo PRs + pushes to main; no secrets
#   7 build + budgets → build           next build · size-limit [Phase 1 baseline] · prod-guard · bundle string scan
#   7 types           → types-drift     supabase gen types ↔ src/modules/shared-types/database.types.ts [red until S2/S5]
#   sec               → gitleaks        gitleaks (pinned binary, .gitleaks.toml) · npm audit --audit-level=high with an
#                                        expiring allow-list (scripts/ci/check-audit.mjs) · exact-version pins + lockfile
#   8 preview + lhci  → (Vercel preview, warn-only day one; wired once bb-ldn exists — HANDOFF §2 row 6)
#
# Rules applied: every action and tool pinned (commit SHA / exact version); `npm ci` with cache; artefacts uploaded
# `if: always()`; minimal token permissions; no secrets in this file — the CI env below is placeholder-only so
# `next build` can collect page data (07 §7: real values live in Vercel env + the keychain, never here).
# Steps that cannot be green on the raw Sydney copy are NOT disabled (HANDOFF §11 S0) — they run and go red; the unit
# that turns each green is named inline.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Placeholder-only env (non-secret) so `next build` can collect page data and `config/env.ts` parses (01 §3.3;
  # 07 §7: real values live in Vercel env + the keychain, never here). Kept in step with .env.test — the config.env
  # suite parses this block. Names: src/modules/config/lib/env-schema.ts (50; .env.example is generated from it).
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  CRON_SECRET: placeholder-cron-secret
  ADMIN_API_TOKEN: placeholder-admin-token
  SYSTEM_PARENT_ID: 00000000-0000-4000-8000-000000000000
  ADMIN_EMAIL: admin@example.test
  SUPPORT_INBOX: support@example.test
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
  STRIPE_MODE: test
  STRIPE_SECRET_KEY: sk_test_ci-dummy # hyphen keeps the gitleaks stripe rule from matching a placeholder
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  STRIPE_PRICE_SELF_SERVE_APP_UPFRONT: price_placeholder_upfront
  STRIPE_PRICE_SELF_SERVE_APP_MONTHLY: price_placeholder_monthly
  PURCHASE_PROVIDER: stub-stripe
  STUB_EVENT_SECRET: placeholder-stub-event-secret
  EMAIL_PROVIDER: stub-email
  SMS_PROVIDER: null-sms
  AREAS_SOURCE: stub
  RESEND_API_KEY: re_placeholder
  EMAIL_DEV_DRY_RUN: "true"
  OPENAI_API_KEY: placeholder-openai
  GOOGLE_AI_API_KEY: placeholder-google
  KATIE_DAILY_LIMIT_USD: "2"
  KATIE_ENABLED: "true"
  NEXT_PUBLIC_KATIE_ENABLED: "true"
  INVITE_LINKS_ENABLED: "true"
  NEW_TRIALS_ENABLED: "true"
  PAYMENTS_ENABLED: "true"
  NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o0.ingest.sentry.example.test/0 # the public reader uses the preview column under NODE_ENV=production
  # Legacy-tree names only (never defined in London — 06 §2.5); module-load guards in the Sydney tree still read them until F-d.
  SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_INVITE_BASE_URL: http://localhost:3000

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: tsc --noEmit --pretty false (05 §9 stage 2)
        run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: eslint (05 §9 stage 1; §7 boundary + platform rules once S6 lands)
        run: npm run lint
      - name: check:long-functions — the 50-line allow-list is a RATCHET, not a drawer (REVIEW-4 M-6 / R-8)
        # `eslint.long-functions.json` turns the 50-line rule off per file. It grew 106 -> 109 in one cycle while
        # both limiter allow-files fail on a stale entry by design. This step is the missing sibling: entries
        # must exist, must carry a reason, and the count may only fall.
        if: ${{ !cancelled() }}
        run: npm run check:long-functions
      - name: prettier --check (05 §9 stage 1) — red on the raw copy until S1 formats the legacy tree
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: CLAUDE.md = CODE-CLAUDE.md — LOCAL GATE (HANDOFF §3.3 (ii))
        # CODE-CLAUDE.md lives in ../SPECS/00-foundations/ (workspace repo), not in this checkout, so the byte
        # diff cannot run here. The script passes with a notice when CI=true and the source is absent; locally
        # (`npm run check:claude-md`, part of `npm run gates`) it is mandatory and a missing source is an error.
        if: ${{ !cancelled() }}
        run: npm run check:claude-md

  allowed-imports:
    name: allowed-imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: gen-boundary-rules --check (05 §7 rule 1, §10) — eslint.boundaries.js = a fresh generation
        run: npm run check:allowed-imports
      - name: eslint boundaries over src/modules (05 §7 rules 1–4) — S6; flat config, so ESLINT_USE_FLAT_CONFIG
        if: ${{ !cancelled() }}
        run: npm run lint:boundaries

  limiter-call-sites:
    name: limiter-call-sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: every declared rate-limit policy has a call site (ADR-140 (2); ADR-142 (2)) — recorded gaps in scripts/ci/limiter-call-sites.allow.json
        run: npm run check:limiter-call-sites
      - name: every server action reaches a limiter (REVIEW-3 R-3 / M-1) — the inverse check; recorded gaps under "actions" in the same allow file
        if: ${{ !cancelled() }}
        run: npm run check:action-limits

  # ── L-009 `3e` (Q-4) — the green gates, split out of `banned-literals` so that somebody is required to look ──
  #
  # These four steps all pass today and every one of them guards a claim a merge rests on. Until this split they
  # sat in the same job as `banned-words`, which is **red on `main` by construction** (ADR-124: the legacy parent
  # surfaces are not rewritten until F-d). A red job cannot be a required check, so `banned-literals` is not one
  # — and that made `check:config-literals` a control nobody is obliged to read, including ADR-172's
  # `safeguarding` rule, which is the mechanism that keeps a wrong child-safety instruction from returning to the
  # tree. `3c` shipped that rule into a job whose own result nobody has to look at; this is the other half of it.
  #
  # The split is deliberately by *colour*, not by subject: everything that is green and load-bearing moves here,
  # and `banned-literals` keeps exactly the one step that is expected to be red. When F-d turns `banned-words`
  # green the two can merge back, or `banned-literals` joins the required list on its own — either is fine, and
  # neither is urgent once this job is required.
  #
  # **Branch protection is BAI's** (06 §3.4): this job does not add itself. It joins the required-check list per
  # ADR-109 once it is green on `main`.
  config-gates:
    name: config-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: check-config-literals (05 §6; AC-X-23) — jurisdiction (ADR-171) + safeguarding (ADR-172, `everywhere`); legacy tree excluded by literal-exclusions.json until F-d
        run: npm run check:config-literals
      - name: .env.example = generated from the env schema (06 §2.5; HANDOFF §5.4)
        if: ${{ !cancelled() }}
        run: npm run env:check
      - name: vercel.json cron block = generated from config/crons.ts (01 §4f; 06 §4.1 C)
        if: ${{ !cancelled() }}
        run: npm run crons:check
      - name: process.env only in config/env.ts + config/public-env.ts (01 §1.3 rule 1; 07 §10.2) — legacy tree excluded until F-d
        if: ${{ !cancelled() }}
        run: npm run check:env-reads

  # ── The one step that is allowed to be red, alone in its own job so that it says nothing about the others ──
  banned-literals:
    name: banned-literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: banned-words static pre-check (05 §5) — red on the legacy parent surfaces until F-d
        run: npm run check:banned-words

  # ── REVIEW-3 M-10 / R-6 — the behavioural proof of every SQL-only control, in a job that can block a merge ──
  #
  # `int.rpc-*`, `int.rls`, `int.storage-rls` and `db.constraints` are the ONLY place the column allow-lists, the
  # consent gate, the isolation writer and the bucket policies are tested against behaviour rather than against a
  # mock. Until now they ran only inside `test`, which is not a required check and is red for reasons of its own
  # (the `contract` vitest project does not exist; the legacy Playwright journeys need a seeded database) — so
  # excellent tests with no teeth, and REVIEW-3's CRITICAL is the worked example of what that costs: the gap it
  # found lives in exactly the seam between a mock and a column.
  #
  # The stack is started **in the runner** and `supabase db reset` applies `0000`–`00NN` forward from empty (the whole set, whatever its head), so
  # this job also proves on every PR that the whole ordered migration set still applies to an empty database —
  # the other thing nothing checked. No secrets and no hosted project: `bb-ldn-preview` is behind (B-45) and a
  # preview-backed job would be red for reasons that are not the code's. Joins the required checks when it is
  # green (ADR-109).
  #
  # ★ **A SKIP IS NOT A PASS** (REVIEW-4 M-4 / §8 R-6). This job carried a job-level
  # `if: …head.repo.full_name == github.repository || …` so a fork's runner was not spent on it. Both halves of
  # the consequence were confirmed by measurement: branch protection lists `integration` among the required
  # checks, and **a job skipped by a job-level `if` reports "skipped", which branch protection counts as
  # success**. So on a fork PR — and this repository is PUBLIC — the one gate guarding the mock-versus-column
  # seam reported green without running a line. The fork reasoning was sound; what was missing was that its
  # consequence was silent.
  #
  # The `if` is therefore gone from the job and lives in a **step** instead. The job always starts, and on a PR
  # from a fork its first step fails with a message saying so. A fork PR is now RED rather than green-by-absence,
  # which is the honest report: this gate cannot run here, so it has not passed here. A maintainer who wants such
  # a PR merged runs it from a branch in this repository, which is the same thing they had to do before — the
  # difference is that the check now says so out loud instead of quietly agreeing.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: refuse to report a skip as a pass (REVIEW-4 M-4)
        # A fork's runner is not ours to spend, and a required check that reports success without running is
        # worse than one that is missing. So the job runs and fails, rather than skipping and passing.
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error title=integration cannot run on a fork PR::This job starts a Supabase stack in the runner and is a required check. It is not run for pull requests from forks (a fork's runner is not ours to spend), and a job that SKIPS reports success to branch protection — so it fails instead. Re-open this pull request from a branch in ${{ github.repository }} to run it."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: supabase start + db reset — the whole ordered set applied forward from empty (02 §6)
        run: |
          supabase start
          supabase db reset
      - name: vitest --project integration (05 §9 stage 5) — db.constraints first, then the rpc / rls suites
        # `SUPABASE_DB_URL` is the one name the suites read (`supabase/__tests__/db-client.ts`); left unset it
        # falls back to the local stack's own URL, which is exactly what `supabase start` just brought up.
        run: npx vitest run --project integration
      - name: supabase stop
        if: always()
        run: supabase stop --no-backup || true

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # diff-cover needs origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: unit + coverage (05 §9 stage 3)
        # `--project unit` because S5 added a second vitest project: stage 3 is the unit suites with
        # no database, and stage 5 below is the integration ones against the applied migrations.
        # Without it this step sweeps both and fails on a database that has not been started yet.
        run: npx vitest run --project unit --coverage --coverage.reporter=lcov
      - name: changed-line coverage ≥ 80 % (05 §9 stage 3; 07 §10.2)
        # Follow-up (security-reviewer, S0): move to `pip install --require-hashes -r requirements-ci.txt` once S2
        # stabilises the test job — version-pinned today, hash-pinned then.
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet diff-cover==10.0.0
          git fetch --no-tags origin main
          diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=80
      - name: contract suites (05 §9 stage 4; 05 §3) — red until S2 adds the `contract` vitest project
        if: ${{ !cancelled() }}
        run: npx vitest run --project contract
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          version: 2.117.0
      - name: integration (05 §9 stage 5) — green from S5 — db.constraints, enum-ordinals, int.rls
        if: ${{ !cancelled() }}
        run: |
          supabase start
          supabase db reset
          npx vitest run --project integration
      - name: e2e (05 §9 stage 6) — E1 shell smoke — green
        if: ${{ !cancelled() }}
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npm run check:boot-guard
          npm run test:shell-smoke
      - name: e2e (05 §9 stage 6) — legacy Sydney journeys — red until F-d / Phase 1 rewrites them
        if: ${{ !cancelled() }}
        # They need a seeded database and real credentials (`.env.local`), neither of which exists here. Not
        # disabled (HANDOFF §11 S0): it runs and goes red, and the unit that turns it green is named above.
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-artefacts
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: next build (05 §9 stage 7)
        run: npm run build
      - name: size-limit (05 §8.1 budgets) — red until the Phase-1-exit baseline lands a .size-limit config
        if: ${{ !cancelled() }}
        run: npx --no-install size-limit
      - name: bundle string scan — server-only names + stub-stripe absent from client chunks (AC-X-35 / 36)
        if: ${{ !cancelled() }}
        run: npm run check:bundle-secrets
      # Green from F-c; E1 fixed the script's environment so the non-zero exit is the stub guard rather than
      # four missing prod-column names (see scripts/ci/prod-guard-boot.sh).
      - name: prod-guard — production boot with PURCHASE_PROVIDER=stub-stripe must exit non-zero (07 §5.5)
        if: ${{ !cancelled() }}
        run: npm run check:prod-guard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-manifests
          path: |
            .next/build-manifest.json
            .next/app-build-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  types-drift:
    name: types-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: generated types drift-free (05 §10; HANDOFF §6.4) — red until S2 (file) + S5 (migrations)
        run: |
          supabase start
          supabase gen types typescript --local > /tmp/database.types.generated.ts
          diff /tmp/database.types.generated.ts src/modules/shared-types/database.types.ts

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks — pinned binary, checksum-verified, full history, .gitleaks.toml allowlist (07 §10.2; 06 §4.3)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: npm audit --audit-level=high with the expiring allow-list (07 §10.2; scripts/ci/audit-allowlist.json)
        if: ${{ !cancelled() }}
        run: npm run check:audit
      - name: exact-version pins + lockfile (07 §10.2) — red on the raw copy (Sydney `^` ranges) until S1
        if: ${{ !cancelled() }}
        run: npm run check:pins
